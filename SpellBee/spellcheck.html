<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpellBee</title>
    <link rel="stylesheet" href="spellcheck.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="quiz">
      <header class="title">
        <p class="eyebrow">SPELLBEE</p>
        <h1>So you think you can spell?</h1>
        <p id="progress" aria-live="polite"></p>
      </header>
      <section class="question-card" aria-labelledby="question">
        <p id="prompt">Choose the correctly spelled word.</p>
        <h2 id="question"></h2>
        <div id="options" class="options"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
        <button id="next" class="next" type="button" disabled>Next word</button>
      </section>
    </main>
    <script src="spellcheck.js"></script>
</body>
</html>
