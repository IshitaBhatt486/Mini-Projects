<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Password Generator</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Password Generator</h1><label>Length <input id="length" type="number" min="4" max="128" value="16"></label><fieldset><legend>Include</legend><label><input id="lowercase" type="checkbox" checked> Lowercase</label><label><input id="uppercase" type="checkbox" checked> Uppercase</label><label><input id="numbers" type="checkbox" checked> Numbers</label><label><input id="symbols" type="checkbox" checked> Symbols</label></fieldset><button id="generate" type="button">Generate password</button><output id="password" aria-live="polite"></output></main><script src="index.js"></script></body>
</html>
